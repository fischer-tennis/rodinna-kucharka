<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a3e1d">
<title>Rodinná kuchařka</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <small>Rodinný archiv receptů</small>
    <h1>Rodinná kuchařka</h1>
  </div>
  <button id="installBtn" hidden>Přidat do mobilu</button>
</header>

<main>
  <section class="hero">
    <h2>Recepty ze starého sešitu, přepsané pro celou rodinu ❤️</h2>
    <div class="searchrow">
      <input id="search" placeholder="Hledat recept, autora nebo surovinu…">
      <select id="category"><option value="">Všechny kategorie</option></select>
    </div>
    <div id="stats"></div>
  </section>
  <section id="cards" class="grid"></section>
</main>

<dialog id="detail">
  <button class="close" onclick="detail.close()">×</button>
  <div id="detailContent"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
