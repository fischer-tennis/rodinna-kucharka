<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1712">
<meta name="application-name" content="Rodinná kuchárka">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rodinná kuchárka">
<title>Rodinná kuchárka</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <small>Rodinný archív receptov</small>
    <h1>Rodinná kuchárka</h1>
  </div>
  <button id="installBtn" hidden>Pridať do mobilu</button>
</header>

<main>
  <section class="hero">
    <h2>Recepty zo starého zošita, prepísané pre celú rodinu ❤️</h2>
    <div class="searchrow">
      <input id="search" placeholder="Hľadať recept, autora alebo surovinu…">
      <select id="category"><option value="">Všetky kategórie</option></select>
    </div>
    <div id="stats"></div>
  </section>
  <section id="cards" class="grid"></section>
</main>

<dialog id="detail">
  <button class="close" onclick="detail.close()">×</button>
  <div id="detailContent"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
