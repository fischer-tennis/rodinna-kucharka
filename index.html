<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7b211b"><title>Rodinná kuchárka</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Rodinná kuchárka</h1><button id="accountBtn">👤 Prihlásiť</button></header>
<main><section class="hero"><h2>Recepty našich babičiek, mamičiek a celej rodiny.</h2><input id="search" type="search" placeholder="Hľadať recept alebo surovinu…"></section><div class="toolbar"><button id="addRecipeBtn" hidden>＋ Pridať recept</button></div><div id="cards" class="grid"></div></main>
<dialog id="authDialog"><button class="close">×</button><h2>Prihlásenie</h2><input id="authName" placeholder="Meno"><input id="authEmail" type="email" placeholder="E-mail"><input id="authPassword" type="password" placeholder="Heslo"><button id="loginBtn">Prihlásiť</button><button id="signupBtn">Vytvoriť účet</button><button id="forgotBtn">Zabudnuté heslo</button><button id="logoutBtn" hidden>Odhlásiť sa</button><p id="authMessage"></p></dialog>
<dialog id="addDialog"><button class="close">×</button><h2>Pridať recept</h2>
<section class="ai"><h3>✨ Pomoc s prepisom cez ChatGPT</h3><p>Bez API poplatkov – použiješ svoj ChatGPT účet.</p>
<div class="row"><label class="pick">📷 Odfotiť recept<input id="cameraRecipeImage" type="file" accept="image/*" capture="environment" hidden></label><label class="pick">🖼️ Vybrať fotografiu<input id="galleryRecipeImage" type="file" accept="image/*" hidden></label></div>
<div id="aiPhotoPreview" hidden></div><div class="row"><button id="copyPromptBtn">1. Skopírovať zadanie</button><button id="openChatGPTBtn">2. Otvoriť ChatGPT</button></div>
<textarea id="chatgptResult" rows="8" placeholder="Sem vlož výsledok z ChatGPT…"></textarea><button id="fillFromChatGPTBtn">3. Vyplniť polia receptu</button><p id="aiMessage"></p></section>
<label>Názov<input id="newTitle"></label><label>Kategória<input id="newCategory"></label><label>Autor<input id="newAuthor"></label><label>Suroviny<textarea id="newIngredients" rows="7"></textarea></label><label>Postup<textarea id="newInstructions" rows="8"></textarea></label><label>Fotka hotového jedla<input id="newFoodImage" type="file" accept="image/*"></label><label>Fotka originálu<input id="newNotebookImage" type="file" accept="image/*"></label><button id="saveNewRecipe">Uložiť recept</button><p id="addMessage"></p></dialog>
<footer>Rodinná kuchárka · v2.0</footer><script type="module" src="app.js"></script></body></html>
